version = 1

[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 dorsaltegmentum"
SPDX-License-Identifier = "AGPL-3.0-or-later"


# Original plugin icon, including its rendered bitmap.
[[annotations]]
path = ["assets/icon.svg", "assets/icon.png"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 dorsaltegmentum"
SPDX-License-Identifier = "AGPL-3.0-or-later"


# Catalog structure and colour values retain all component terms; ATTRIBUTION.md maps each entry.
[[annotations]]
path = ["shared/palettes/catalog.json", "skills/*/scripts/_shared/palettes/catalog.json"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 dorsaltegmentum", "Colour Universal Design palette by Masataka Okabe and Kei Ito (https://jfly.uni-koeln.de/color/); popularised by B. Wong, Nature Methods 8, 441 (2011). Used with credit as the authors ask.", "Copyright (c) 2019, Paul Tol, Clément Haëck (tol_colors package); colour schemes © Paul Tol", "IBM Design Language colour values, International Business Machines Corporation", "Colour cycles by Matthew A. Petroff, dedicated to the public domain (CC0-1.0); see M. A. Petroff, \"Accessible Color Sequences for Data Visualization\", arXiv:2107.02270", "Copyright (C) Free Software Foundation, Inc. (modus-themes by Protesilaos Stavrou); colour values only", "Copyright (c) 2021 Catppuccin", "Copyright (c) 2019 sainnhe", "Copyright (c) 2011 Ethan Schoonover", "viridis by Stéfan van der Walt and Nathaniel Smith (BIDS mpl-colormaps), CC0-1.0 public domain dedication", "cividis by Jamie R. Nuñez, Christopher R. Anderton and Ryan S. Renslow, \"Optimizing colormaps with consideration for color vision deficiency to enable accurate interpretation of scientific data\", PLOS ONE 13(7): e0199239 (2018). Values from pnnl/cmaputil, Copyright Battelle Memorial Institute; its permissive licence text is in ATTRIBUTION.md.", "Copyright (c) 2002 Cynthia Brewer, Mark Harrower, and The Pennsylvania State University", "U.S. Web Design System, General Services Administration; public domain in the United States, worldwide CC0-1.0 waiver", "Copyright (c) 2017 Crown Copyright (Government Digital Service)", "Copyright (c) 2018 GitHub Inc.", "Copyright (c) 2017 Eric Bailey", "Primer neutral colours: Copyright (c) GitHub, Inc.; Petroff colour cycles: CC0-1.0"]
SPDX-License-Identifier = "AGPL-3.0-or-later AND Apache-2.0 AND BSD-3-Clause AND CC-BY-4.0 AND CC0-1.0 AND GPL-3.0-or-later AND LicenseRef-palette-attribution AND MIT"


# Attribution document includes the full upstream Battelle terms.
[[annotations]]
path = ["shared/palettes/ATTRIBUTION.md", "skills/*/scripts/_shared/palettes/ATTRIBUTION.md"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 dorsaltegmentum", "2017 Battelle Memorial Institute"]
SPDX-License-Identifier = "AGPL-3.0-or-later AND LicenseRef-palette-attribution"


# Hand-tuned theme values retain Catppuccin attribution.
[[annotations]]
path = ["shared/palettes/overrides/catppuccin-*.toml", "skills/*/scripts/_shared/palettes/overrides/catppuccin-*.toml"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 dorsaltegmentum", "2021 Catppuccin"]
SPDX-License-Identifier = "AGPL-3.0-or-later AND MIT"


# Hand-tuned theme values retain Everforest attribution.
[[annotations]]
path = ["shared/palettes/overrides/everforest-*.toml", "skills/*/scripts/_shared/palettes/overrides/everforest-*.toml"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 dorsaltegmentum", "2019 sainnhe"]
SPDX-License-Identifier = "AGPL-3.0-or-later AND MIT"


# Unmodified bundled font binaries and upstream OFL notices. Font catalogs describe optional fonts only.
[[annotations]]
path = ["shared/fonts/noto-sans/**", "shared/fonts/noto-sans-mono/**", "skills/*/scripts/_shared/fonts/noto-sans/**", "skills/*/scripts/_shared/fonts/noto-sans-mono/**"]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Noto Project Authors (https://github.com/notofonts/latin-greek-cyrillic)"
SPDX-License-Identifier = "OFL-1.1"
